<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StageLink</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=language" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo-section">
            <div class="logo"><img src="Logo/Logo.png"></div>
            <h2>STAGELINK</h2>
        </div>
        <nav class="nav-links">
            <a href="studentPortal.html">Students</a>
            <a href="employerPortal.html">Employers</a>
            <a href="#"><span class="material-symbols-outlined">
                    language
                </span></a>
        </nav>
    </header>
    <main>
        <aside class="filters">
            <h3>Filters</h3>
            <!-- Placeholder filter UI -->
            <input type="text" placeholder="Search" style="width: 80%; padding: 8px; margin-bottom: 10px;">
            <div>
                <label for="location">Location:</label>
                <select id="location" style="width: 80%; padding: 8px; margin-bottom: 10px; margin-top: 10px;">
                    <option value="">All</option>
                    <option value="ottawa">Ottawa</option>
                    <option value="montreal">Montreal</option>
                    <option value="vancouver">Vancouver</option>
                    <option value="halifax">Halifax</option>
                </select>
            </div>
            <div>
                <label>Duration (months):</label>
                <div style="display:flex; align-items:center; gap:10px;margin-bottom: 10px; margin-top: 10px;">
                    <span>1</span>
                    <input type="range" min="1" max="12" value="6" style="width:60%;">
                    <span>12</span>
                </div>
            </div>
            <div>
                <label for="company">Company:</label>
                <select id="company" style="width: 80%; padding: 8px; margin-bottom: 10px; margin-top: 10px;">
                    <option value="">All</option>
                    <!-- Options added here by master.js -->
                </select>
        </aside>
        <section class="internship-grid" id="job-listings">
            <!-- Internships added here by master.js -->
        </section>
    </main>
    <script src="master.js"></script>
</body>

</html>
