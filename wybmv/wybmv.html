<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I love you</title>
    <style>
        body {
            background-color: pink;
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh;
        }

        #love-image {
            display: block;
            max-width: 90vw;
            width: auto;
            height: auto;
            margin: 0 auto;
            transform-origin: center center;
            transition: transform 0.3s ease, width 0.3s ease;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100vh;
        }

        #answer-buttons {
            margin-top: 20px;
        }

        button {
            background-color: red;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: darkred;
        }

        #hidden-button {
            background-color: transparent;
            color: transparent;
            border: none;
            padding: 5px;
            margin-top: 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #hidden-button:hover {
            color: rgba(255, 0, 0, 0.109);
            border: 1px solid rgba(255, 0, 0, 0.109);
        }
    </style>
</head>

<body>
    <div class="container">
        <div>
            <img id="love-image" src="koalaHeart.png" alt="Will you be my valentine?"><br>
            <h1 id="header" style="text-align: center; align-items: center;">Will you be my valentine?</h1>
            <div id="answer-buttons">
                <button id="yes-button" onclick="yes()">Yes</button>
                <button id="no-button" onmouseover="no()">No</button>
            </div>
            <button hidden id="hidden-button" onclick="showLetter()">Secret Message</button>
        </div>

        <script>
            const noBtn = document.getElementById("no-button");
            const yesBtn = document.getElementById("yes-button");
            const computedStyle = window.getComputedStyle(yesBtn);
            const loveImage = document.getElementById("love-image");
            const header = document.getElementById("header");
            const hiddenBtn = document.getElementById("hidden-button");

            function yes() {
                header.innerText = "Yay! Great decision!";
                header.style.transform = "translateY(20px)";
                loveImage.style.transform = "scale(1.5)";
                loveImage.src = "happy.gif";

                yesBtn.style.display = "none";
                noBtn.style.display = "none";

                hiddenBtn.hidden = false;
            }

            function no() {
                const button = event.target;
                const container = document.querySelector('.container');
                const containerRect = container.getBoundingClientRect();
                const buttonRect = button.getBoundingClientRect();

                const offsetX = Math.random() * (containerRect.width - buttonRect.width);
                const offsetY = Math.random() * (containerRect.height - buttonRect.height);

                button.style.position = 'absolute';
                button.style.left = `${offsetX}px`;
                button.style.top = `${offsetY}px`;

                if (parseInt(computedStyle.width) <= containerRect.width * 0.3) {
                    let newHeight, newWidth;
                    newHeight = Math.round(parseInt(computedStyle.height) * 1.3) + 'px';
                    newWidth = Math.round(parseInt(computedStyle.width) * 1.3) + 'px';

                    yesBtn.style.height = newHeight;
                    yesBtn.style.width = newWidth;
                    yesBtn.style.fontSize = Math.round(parseInt(computedStyle.fontSize) * 1.3) + 'px';
                }
                else {
                    header.innerText = "Damn what the hell...";
                    loveImage.src = "sad.gif";
                }
            }
            
            function showLetter() {
                window.location.href = "letter.html";
            }
        </script>

</body>

</html>
